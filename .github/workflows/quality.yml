name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-environment.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run security:secrets
        env:
          EXPOSED_CREDENTIAL_SHA256: ${{ secrets.EXPOSED_CREDENTIAL_SHA256 }}
          CREDENTIALS_ROTATED: ${{ vars.CREDENTIALS_ROTATED }}
      - run: npm run data:validate
      - run: npm run db:verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:geography
      - run: npm run build
      - run: npm run test:ui-budget
      - run: npm run test:contrast
      - run: npm audit --audit-level=high
      - run: npm run test:ui
      - run: npm run test:ui
      - run: npm run test:ui
      - run: npm run test:production
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .artifacts/

  visual-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:visual
        env:
          PLAYWRIGHT_CHANNEL: msedge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence
          path: .artifacts/ui-visual/
